services:
  travel-web:
    image: ${DOCKER_USER:-danishdopsa}/travel-app:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-web-service
    ports:
      - "${HOST_PORT:-8085}:80"
    environment:
      DB_HOST: ${DB_HOST:-travel-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-travel_db}
      POSTGRES_USER: ${POSTGRES_USER:-danish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danish_secure_pass}
    networks:
      - travel-network
    depends_on:
      travel-db:
        condition: service_healthy
    restart: unless-stopped

  travel-db:
    image: postgres:15-alpine
    container_name: travel-db-service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_db}
      POSTGRES_USER: ${POSTGRES_USER:-danish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-danish_secure_pass}
    volumes:
      - travel_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      travel-network:
        aliases:
          - db
          - travel-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-danish} -d ${POSTGRES_DB:-travel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  travel-adminer:
    image: adminer:latest
    container_name: travel-adminer-service
    ports:
      - "${ADMINER_PORT:-8086}:8080"
    networks:
      - travel-network
    depends_on:
      travel-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  travel_pgdata:
    driver: local

networks:
  travel-network:
    driver: bridge
